name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check --isolated --target-version py39 --select E4,E7,E9,F run.py tests

      - name: Check formatting
        run: python -m ruff format --isolated --target-version py39 --check run.py tests

      - name: Run unit tests
        run: python -m pytest -q

  arm64-image:
    name: Build Home Assistant Green image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build arm64 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: local/atv3-evdev-bridge:ci
          build-args: |
            BUILD_VERSION=3.1.1
            BUILD_ARCH=aarch64
          cache-from: type=gha
          cache-to: type=gha,mode=max
