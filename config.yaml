name: "ATV3 Evdev Bridge"
version: "3.1"
slug: "atv3_evdev_bridge"
description: "Reads Remoter ATV3 Bluetooth evdev input and emits HA events with full button mapping."
arch:
  - aarch64

startup: application
boot: auto
init: false

# We are calling the HA REST API proxy at http://supervisor/core/api/...
homeassistant_api: true

# Automatic discovery across reconnects requires elevated access to /dev/input.
apparmor: false
full_access: true

options:
  target_contains: "Remoter ATV3"
  event_type: "atv3_evdev_bridge_command_received"
  grab_device: true
  ignore_scancodes: "700aa"
  hold_delay: 0.25
  hold_repeat: 0.10
  log_level: "INFO"

schema:
  # Supervisor's bounded str schema compares the value with numeric limits.
  # Keep the UI type broad; run.py rejects empty and whitespace-only values.
  target_contains: str
  event_type: "match(^[A-Za-z0-9_]+$)"
  grab_device: bool
  ignore_scancodes: 'match(^$|^[0-9A-Fa-f]+(?:[ \t]*,[ \t]*[0-9A-Fa-f]+)*$)'
  hold_delay: "float(0.05,10)"
  hold_repeat: "float(0.05,10)"
  log_level: "list(DEBUG|INFO|WARN|ERROR)"
